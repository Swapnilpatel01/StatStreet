  <style>:root {
  --bg: #0b0d10;
  --card: #14171c;
  --card2: #1b1f26;
  --line: #262b33;
  --text: #eceef1;
  --muted: #8b939e;
  --faint: #5b636e;
  --up: #1fd67a;
  --down: #ff5a5f;
  --up-bg: rgba(31, 214, 122, .12);
  --down-bg: rgba(255, 90, 95, .12);
  --accent: #1fd67a;
  --live: #ff3b30;
  --nba: #f97316; --nfl: #22c55e; --mlb: #3b82f6;
  --r: 14px;
  --safe-t: env(safe-area-inset-top);
  --safe-b: env(safe-area-inset-bottom);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; scrollbar-width: none; }
*::-webkit-scrollbar { display: none; width: 0; height: 0; }
/* The page never scrolls; each screen scrolls inside its own container like a native app. */
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bg); color: var(--text); }
/* Everything is positioned against <body> (not the viewport), and when installed on the
   Home Screen the page is sized to the full screen. This works around an iOS 26 WebKit bug
   where installed web apps report a viewport that is short by the status-bar height,
   which left an empty band under the tab bar. */
body { position: relative; }
@media (display-mode: standalone) { html { height: 100lvh; } }
body {
  font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
  touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-text-size-adjust: 100%;
}
input, textarea { -webkit-user-select: text; user-select: text; }
a, img, svg { -webkit-touch-callout: none; -webkit-user-drag: none; }
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; }
img { display: block; }
[hidden] { display: none !important; }

.view {
  position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain;
  padding: calc(var(--safe-t) + 12px) max(16px, calc((100% - 640px) / 2)) calc(var(--safe-b) + 90px);
}
#ptr {
  position: absolute; left: 50%; top: calc(var(--safe-t) + 6px); z-index: 15; width: 30px; height: 30px; border-radius: 50%;
  background: var(--card2); display: grid; place-items: center; opacity: 0; transform: translate(-50%, 0); pointer-events: none;
}
#ptr svg { width: 18px; height: 18px; fill: none; stroke: var(--muted); stroke-width: 2.4; stroke-linecap: round; }
#ptr.ready svg { stroke: var(--up); }
#ptr.spin svg { stroke: var(--up); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- tab bar ---------- */
.tabbar {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
  display: flex; justify-content: space-around;
  padding: 6px 8px calc(var(--safe-b) + 6px);
  background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--line);
}
.tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; color: var(--faint); padding: 4px 0; transition: transform .12s; }
.tabbar button:active { transform: scale(.9); }
.tabbar svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabbar button.active { color: var(--text); }

/* ---------- type ---------- */
h1 { font-size: 30px; line-height: 1.1; margin: 0; letter-spacing: -.02em; font-weight: 700; }
h2 { font-size: 20px; margin: 26px 0 10px; letter-spacing: -.01em; }
h3 { font-size: 13px; margin: 20px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 13px; }
.tiny { font-size: 11.5px; }
.up { color: var(--up); }
.down { color: var(--down); }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; min-height: 30px; }
.brand { font-weight: 800; letter-spacing: -.02em; font-size: 17px; }
.brand b { color: var(--accent); }
.sync { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.sync .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.sync.busy .dot { background: var(--accent); animation: pulse 1s infinite; }
.sync.err .dot { background: var(--down); }
@keyframes pulse { 50% { opacity: .3; } }

.big-value { font-size: 38px; font-weight: 700; letter-spacing: -.03em; margin-top: 8px; }
.change-line { font-size: 14px; margin-top: 2px; }

/* ---------- segmented / chips ---------- */
.seg { display: flex; background: var(--card); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { flex: 1; padding: 7px 0; border-radius: 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
.seg button.on { background: var(--card2); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.4); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 4px; scrollbar-width: none; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 6px 12px; border-radius: 999px; background: var(--card); font-size: 13px; color: var(--muted); border: 1px solid transparent; font-weight: 600; }
.chip.on { color: var(--text); border-color: var(--line); background: var(--card2); }
.ranges { display: flex; justify-content: space-between; margin: 6px 0 4px; }
.ranges button { padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 700; color: var(--muted); }
.ranges button.on { background: var(--card2); color: var(--text); }

/* ---------- cards & lists ---------- */
.card { background: var(--card); border-radius: var(--r); padding: 14px; }
.list { background: var(--card); border-radius: var(--r); overflow: hidden; }
.item { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
.item:last-child { border-bottom: 0; }
.item:active { background: var(--card2); }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--card2); object-fit: cover; flex: none; overflow: hidden; }
.avatar.team { border-radius: 10px; object-fit: contain; padding: 4px; background: #fff1; }
.avatar-fallback { width: 40px; height: 40px; border-radius: 50%; background: var(--card2); display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--muted); flex: none; }
.name { font-weight: 600; }
.sub { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.price-col { text-align: right; flex: none; }
.price { font-weight: 600; }
.pill { display: inline-block; min-width: 72px; text-align: center; padding: 5px 8px; border-radius: 8px; font-size: 13px; font-weight: 700; }
.pill.up { background: var(--up-bg); } .pill.down { background: var(--down-bg); }
.lg { font-size: 10px; font-weight: 800; padding: 1px 5px; border-radius: 4px; letter-spacing: .04em; color: #0b0d10; }
.lg.nba { background: var(--nba); } .lg.nfl { background: var(--nfl); } .lg.mlb { background: var(--mlb); }
.tag { font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 4px; background: var(--card2); color: var(--muted); }
.tag.inj { background: var(--down-bg); color: var(--down); }
.tag.live { background: var(--live); color: #fff; animation: pulse 1.6s infinite; }
.tag.ipo { background: #7c5cff33; color: #b8a6ff; }
.spark { flex: none; }
.empty { padding: 26px 16px; text-align: center; color: var(--muted); font-size: 14px; }
.more { display: block; width: 100%; padding: 13px; color: var(--accent); font-weight: 600; font-size: 14px; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--card); border-radius: 12px; padding: 11px 12px; }
.stat .k { font-size: 11.5px; color: var(--muted); }
.stat .v { font-size: 17px; font-weight: 700; margin-top: 2px; }

.index-card { background: var(--card); border-radius: 12px; padding: 10px 12px; text-align: left; }
.index-card .v { font-weight: 700; font-size: 16px; margin-top: 3px; }

.live-strip { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 4px; scrollbar-width: none; }
.live-strip::-webkit-scrollbar { display: none; }
.game { flex: none; background: var(--card); border-radius: 12px; padding: 9px 12px; min-width: 150px; font-size: 13px; }
.game .t { display: flex; justify-content: space-between; gap: 12px; font-weight: 600; }

.search { width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; outline: none; font-size: 16px; }
.search:focus { border-color: var(--faint); }

/* ---------- chart ---------- */
.chart-wrap { margin: 10px -16px 0; padding: 0 0; min-height: 190px; }
.chart { display: block; touch-action: pan-y; -webkit-user-select: none; user-select: none; }
.chart-empty { height: 190px; display: grid; place-items: center; color: var(--faint); font-size: 13px; padding: 0 30px; text-align: center; }

/* ---------- detail sheet ---------- */
.sheet {
  position: absolute; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: calc(var(--safe-t) + 8px) max(16px, calc((100% - 640px) / 2)) calc(var(--safe-b) + 76px);
  box-shadow: -8px 0 30px rgba(0,0,0,.35);
}
.sheet.enter { animation: slidein .28s cubic-bezier(.2,.8,.2,1); }
#chain { z-index: 33; }
@keyframes slidein { from { transform: translateX(100%); } }
.sheet-inner { max-width: 640px; margin: 0 auto; }
.icon-btn { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; background: var(--card); }
.icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn.on svg { fill: #ffd60a; stroke: #ffd60a; }
.hero { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
.hero .avatar, .hero .avatar-fallback { width: 56px; height: 56px; }
.trade-bar {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 32; display: flex; gap: 8px; align-items: center;
  padding: 7px 16px max(var(--safe-b), 8px); background: color-mix(in srgb, var(--bg) 84%, transparent); backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4);
  border-top: .5px solid var(--line);
}
.trade-bar .btn { padding: 10px 0; border-radius: 20px; font-size: 15px; }
.trade-bar .btn.opt { flex: none; width: 44px; height: 40px; padding: 0; display: grid; place-items: center; background: var(--card2); border-radius: 50%; }
.trade-bar .btn.opt svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btn { flex: 1; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 16px; text-align: center; transition: transform .12s, opacity .12s; }
.btn:active, .chip:active, .coll:active, .icon-btn:active, .quick button:active, .qty button:active, .type-chips button:active, .index-card:active { transform: scale(.96); opacity: .85; }
.btn.buy { background: var(--up); color: #04210f; }
.btn.sell { background: var(--card2); color: var(--text); }
.btn.sell:disabled { opacity: .4; }
.btn.ghost { background: var(--card); }
.btn.danger { background: var(--down-bg); color: var(--down); }

.driver { display: flex; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--line); align-items: flex-start; }
.driver:last-child { border-bottom: 0; }
.driver .ic { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-size: 13px; flex: none; background: var(--card2); }
.driver .txt { flex: 1; font-size: 14px; min-width: 0; }
.driver .pct { font-weight: 700; font-size: 13px; flex: none; }

.bars { display: flex; align-items: flex-end; gap: 6px; height: 60px; margin-top: 8px; }
.bars div { flex: 1; border-radius: 4px 4px 0 0; background: var(--up); min-height: 3px; }
.bars div.neg { background: var(--down); }

.brk { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.brk:last-child { border-bottom: 0; }

/* ---------- trade sheet ---------- */
.trade-sheet { position: absolute; inset: 0; z-index: 40; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; overscroll-behavior: contain; animation: fade .2s; }
@keyframes fade { from { background-color: rgba(0,0,0,0); } }
.trade-panel {
  width: 100%; max-width: 640px; margin: 0 auto; background: var(--card); border-radius: 20px 20px 0 0;
  padding: 10px 16px calc(var(--safe-b) + 16px); max-height: 92vh; overflow-y: auto; overscroll-behavior: contain;
}
.trade-panel.enter { animation: up .3s cubic-bezier(.2,.8,.2,1); }
@keyframes up { from { transform: translateY(100%); } }
.grabber { width: 38px; height: 5px; border-radius: 3px; background: var(--faint); opacity: .6; margin: 0 auto 12px; }
.qty { display: flex; align-items: center; gap: 12px; margin: 18px 0 8px; }
.qty input { flex: 1; text-align: center; font-size: 40px; font-weight: 700; background: none; border: 0; outline: none; width: 100%; min-width: 0; }
.qty button { width: 46px; height: 46px; border-radius: 50%; background: var(--card2); font-size: 24px; font-weight: 600; }
.quick { display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; }
.quick button { padding: 7px 14px; border-radius: 999px; background: var(--card2); font-size: 13px; font-weight: 600; }
.summary { border-top: 1px solid var(--line); padding-top: 10px; margin-bottom: 14px; }
.summary .brk { border: 0; padding: 5px 0; }
.err { color: var(--down); font-size: 13px; min-height: 18px; text-align: center; margin-bottom: 6px; }

/* ---------- news ---------- */
.news { display: block; padding: 13px 14px; border-bottom: 1px solid var(--line); text-decoration: none; }
.news:last-child { border-bottom: 0; }
.news .h { font-weight: 600; font-size: 15px; }
.news .meta { display: flex; gap: 8px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
.senti { font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 5px; }
.senti.up { background: var(--up-bg); } .senti.down { background: var(--down-bg); } .senti.flat { background: var(--card2); color: var(--muted); }
.tk { font-size: 12px; font-weight: 700; padding: 2px 7px; border-radius: 5px; background: var(--card2); }

/* ---------- account ---------- */
.field { display: block; margin: 8px 0; }
.field input[type=text], .field input[type=url] { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; outline: none; font-size: 16px; }
.toggle { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.toggle:last-child { border-bottom: 0; }
.switch { position: relative; width: 50px; height: 30px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; background: var(--card2); border-radius: 30px; transition: .2s; }
.switch span::after { content: ''; position: absolute; width: 26px; height: 26px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: .2s; }
.switch input:checked + span { background: var(--up); }
.switch input:checked + span::after { transform: translateX(20px); }
.btn-row { display: flex; gap: 10px; margin-top: 10px; }
.prose p { margin: 0 0 10px; color: var(--muted); font-size: 14px; }
.prose b { color: var(--text); }
details summary { cursor: pointer; font-weight: 600; padding: 12px 14px; list-style: none; }
details summary::-webkit-details-marker { display: none; }
details[open] summary { border-bottom: 1px solid var(--line); }
details .prose { padding: 12px 14px 4px; }

/* ---------- boot & toast ---------- */
.boot { position: absolute; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; justify-content: center; padding: 30px 26px calc(var(--safe-b) + 30px); }
.boot .logo { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 20px; }
.boot h1 { font-size: 28px; }
.boot .log { margin-top: 22px; font-size: 13.5px; color: var(--muted); min-height: 120px; }
.boot .log div { padding: 3px 0; }
.boot .log div:last-child { color: var(--text); }
.bar { height: 4px; background: var(--card2); border-radius: 2px; overflow: hidden; margin-top: 18px; }
.bar i { display: block; height: 100%; width: 30%; background: var(--accent); border-radius: 2px; animation: slide 1.2s infinite ease-in-out; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }

.toast {
  position: absolute; left: 50%; top: calc(var(--safe-t) + 10px); transform: translate(-50%, 0) scale(.92); z-index: 60; box-shadow: 0 8px 30px rgba(0,0,0,.4);
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px;
  opacity: 0; pointer-events: none; transition: .25s; max-width: calc(100% - 40px); text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

@media (min-width: 700px) {
  .chart-wrap { margin: 10px 0 0; }
}

/* ---------- v2 additions ---------- */
.sheet, .trade-panel, .trade-bar { --acc: var(--up); }
.sheet.acc-down, .trade-bar.acc-down { --acc: var(--down); }
.unit-lbl { font-size: 13px; color: var(--muted); text-align: center; margin: -4px 0 10px; }
.sheet .ranges button.on { color: var(--acc); }
.btn.buy { background: var(--acc, var(--up)); }
.btn.opt { flex: .8; background: var(--card2); color: var(--text); }
.btn.small { flex: none; padding: 9px 14px; font-size: 14px; border-radius: 10px; }
.icons-right { display: flex; gap: 8px; }
.icon-btn.alerting svg { stroke: #ffd60a; }
.badge-dot { position: relative; }
.badge-dot[data-n]::after { content: attr(data-n); position: absolute; top: -3px; right: -3px; min-width: 17px; height: 17px; border-radius: 9px; background: var(--down); color: #fff; font-size: 10.5px; font-weight: 800; display: grid; place-items: center; padding: 0 4px; }
.sub-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.vs { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.vs b { font-weight: 700; }

.alloc { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--card2); margin-top: 10px; }
.alloc i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 12px; color: var(--muted); }
.legend span::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: var(--c); margin-right: 5px; }

.collections { display: flex; gap: 10px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px 6px; scrollbar-width: none; }
.collections::-webkit-scrollbar { display: none; }
.coll { flex: none; width: 150px; background: var(--card); border-radius: 14px; padding: 12px; text-align: left; }

.coll .d { font-size: 12px; color: var(--muted); margin-top: 2px; }

.rating { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 10px; gap: 2px; }

.rating-legend { display: flex; justify-content: space-between; font-size: 12.5px; margin-top: 6px; }

.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
.stats-grid div { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; gap: 8px; }
.stats-grid div span { color: var(--muted); }
.about { font-size: 14px; color: var(--muted); }

.opt-row { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
.opt-row:last-child { border-bottom: 0; }
.opt-row.itm { background: color-mix(in srgb, var(--acc, var(--up)) 7%, transparent); }
.opt-row .k { font-weight: 700; font-size: 16px; }
.opt-row .ask { min-width: 78px; text-align: center; padding: 7px 8px; border-radius: 9px; font-weight: 700; font-size: 14px; border: 1px solid var(--acc, var(--up)); color: var(--acc, var(--up)); }
.opt-row .held { font-size: 10.5px; font-weight: 800; color: #0b0d10; background: #ffd60a; border-radius: 4px; padding: 1px 5px; margin-left: 6px; }
.price-line { text-align: center; font-size: 11.5px; color: var(--muted); padding: 5px; background: var(--card2); letter-spacing: .04em; font-weight: 700; }
.exp-chips .chip { text-align: center; line-height: 1.2; }

.payoff { margin: 8px 0 4px; }
.payoff svg { display: block; width: 100%; }

.type-chips { display: flex; gap: 6px; margin-top: 12px; overflow-x: auto; scrollbar-width: none; }
.type-chips button { flex: none; padding: 6px 12px; border-radius: 999px; background: var(--card2); color: var(--muted); font-size: 13px; font-weight: 700; }
.type-chips button.on { background: var(--text); color: var(--bg); }
.unit-toggle { display: flex; justify-content: center; margin-top: 10px; }
.unit-toggle .seg { width: 200px; }
.price-field { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--card2); border-radius: 12px; padding: 8px 12px; margin-top: 12px; }
.price-field input { width: 120px; text-align: right; background: none; border: 0; outline: none; font-size: 18px; font-weight: 700; }
.order-desc { font-size: 13px; color: var(--muted); text-align: center; margin: 6px 0 2px; }

.slider { position: relative; height: 58px; border-radius: 29px; background: var(--card2); overflow: hidden; margin-top: 6px; touch-action: none; user-select: none; -webkit-user-select: none; }
.slider .fill { position: absolute; inset: 0 auto 0 0; width: 58px; background: var(--acc, var(--up)); opacity: .25; border-radius: 29px; }
.slider .txt { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; color: var(--muted); font-size: 15px; pointer-events: none; }
.slider .knob { position: absolute; top: 4px; left: 4px; width: 50px; height: 50px; border-radius: 25px; background: var(--acc, var(--up)); color: #04210f; display: grid; place-items: center; font-size: 24px; font-weight: 800; cursor: grab; touch-action: none; }
.slider.disabled { opacity: .45; pointer-events: none; }
.slider.done .knob { transition: left .15s; }
.link-btn { display: block; margin: 10px auto 0; color: var(--muted); font-weight: 600; font-size: 14px; padding: 6px 12px; }

.inbox-item { display: flex; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--line); font-size: 14px; }

.inbox-item .ic { flex: none; }
.x-btn { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--card2); color: var(--muted); font-size: 16px; display: grid; place-items: center; }
.pos-opt .name { font-size: 14.5px; }
.next-game { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

#confetti { position: absolute; inset: 0; z-index: 70; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { .sheet.enter, .trade-panel.enter { animation: none; } }
@media (max-width: 520px) { .stats-grid { grid-template-columns: 1fr; } }

@media (display-mode: standalone) and (orientation: portrait) {
  .toast { top: calc(max(var(--safe-t), 59px) + 12px); }
  #ptr { top: calc(max(var(--safe-t), 59px) + 6px); }
}

/* ---------- v8: Games, cards, heatmap, share ---------- */
#game { z-index: 29; }
.seg.mini { padding: 2px; }
.seg.mini button { padding: 5px 12px; font-size: 12.5px; flex: none; }
.share-btn { display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); padding: 4px 2px; }
.share-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.card.promo { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; margin-top: 12px;
  background: linear-gradient(120deg, color-mix(in srgb, #ffd60a 16%, var(--card)), var(--card) 60%); }
.card.promo .e { font-size: 26px; }
.card.promo:active { transform: scale(.98); }

.daily .dots { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 12px; text-align: center; }
.daily .dd .c { height: 34px; border-radius: 10px; background: var(--card2); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 3px; }

.pick-game { background: var(--card); border-radius: var(--r); padding: 10px 12px 12px; margin-bottom: 10px; }
.pg-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }

.pg-teams { display: flex; align-items: center; gap: 6px; }

.pick-btn { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 12px; background: var(--card2); border: 1.5px solid transparent; text-align: left; transition: transform .12s, opacity .2s; }
.pick-btn:active { transform: scale(.96); }
.pick-btn .avatar, .pick-btn .avatar-fallback { width: 30px; height: 30px; font-size: 10px; }
.pick-btn .pay { font-size: 12.5px; font-weight: 800; color: var(--up); flex: none; }
.pick-btn.on { border-color: var(--up); background: var(--up-bg); }
.pick-btn.off { opacity: .5; }
.pk { font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 5px; background: var(--card2); color: var(--muted); flex: none; }
.pk.won { background: var(--up-bg); color: var(--up); }
.pk.lost { background: var(--down-bg); color: var(--down); }
.score-line { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.lb .rank { width: 22px; text-align: center; font-weight: 800; color: var(--muted); flex: none; }
.lb.you { background: color-mix(in srgb, var(--up) 7%, transparent); }
.lb.you .rank { color: var(--up); }
.tag.own { background: var(--up-bg); color: var(--up); }

/* collectible cards */
.rar { display: inline-block; font-size: 10.5px; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; padding: 2px 7px; border-radius: 5px;
  color: var(--rc); background: color-mix(in srgb, var(--rc) 16%, transparent); }
.rar.legendary { background: linear-gradient(90deg, color-mix(in srgb, var(--rc) 30%, transparent), color-mix(in srgb, #fff 18%, transparent), color-mix(in srgb, var(--rc) 30%, transparent)); background-size: 200% 100%; animation: shimmer 3s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
.card-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pcard { aspect-ratio: 3 / 4; border-radius: 14px; padding: 2px; background: linear-gradient(140deg, var(--rc), color-mix(in srgb, var(--rc) 25%, #222) 55%, var(--rc)); transition: transform .12s; position: relative; overflow: hidden; }
.pcard:active { transform: scale(.95); }
.pcard .in { height: 100%; border-radius: 12px; background: linear-gradient(#1d232c, #0d1014); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 8px 6px; }
.pcard .avatar, .pcard .avatar-fallback { width: 48px; height: 48px; }
.pc-name { font-weight: 700; font-size: 13px; max-width: 100%; }
.pc-rar { font-size: 9.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--rc); }
.pc-lv { position: absolute; top: 7px; right: 8px; font-size: 10px; font-weight: 800; color: var(--text); background: #0008; padding: 1px 5px; border-radius: 4px; }
.pcard.legendary::after, .pcard.epic::after { content: ''; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.22) 50%, transparent 65%); background-size: 250% 100%; animation: shine 3.5s ease-in-out infinite; pointer-events: none; }
@keyframes shine { from { background-position: 150% 0; } to { background-position: -100% 0; } }
.cardsec { display: flex; align-items: center; gap: 12px; }
.pcard-sm { width: 40px; height: 54px; border-radius: 8px; flex: none; display: grid; place-items: center; font-weight: 800; font-size: 18px;
  background: linear-gradient(140deg, var(--rc), color-mix(in srgb, var(--rc) 30%, #111) 60%, var(--rc)); color: #fff; text-shadow: 0 1px 3px #0009; }
.lvbar { height: 6px; border-radius: 3px; background: var(--card2); overflow: hidden; margin: 7px 0 5px; }
.lvbar i { display: block; height: 100%; background: var(--rc); border-radius: 3px; }

.trophies { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.trophy { background: var(--card); border-radius: 12px; padding: 10px 8px; text-align: center; opacity: .45; filter: grayscale(1); }
.trophy.got { opacity: 1; filter: none; background: linear-gradient(160deg, color-mix(in srgb, #ffd60a 12%, var(--card)), var(--card)); }
.trophy .ic { font-size: 24px; }
.trophy .t { font-weight: 700; font-size: 12.5px; margin-top: 4px; }
.trophy .d { font-size: 10.5px; color: var(--muted); margin-top: 2px; line-height: 1.25; }

/* game center */
.gc-head { display: flex; align-items: flex-start; justify-content: space-around; margin-top: 16px; }
.gc-team { display: flex; flex-direction: column; align-items: center; gap: 3px; flex: 1; }

.gc-score { font-size: 40px; font-weight: 800; color: var(--muted); line-height: 1.1; }

.gc-at { color: var(--faint); margin-top: 20px; }
.wp { margin-top: 16px; }
.wp-bar { height: 8px; border-radius: 4px; background: var(--mlb); overflow: hidden; margin-top: 6px; }
.wp-bar i { display: block; height: 100%; background: var(--nba); }

/* heatmap */
.heat { position: relative; border-radius: var(--r); overflow: hidden; background: var(--card); }
.tile { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; border: 1px solid var(--bg); overflow: hidden; text-shadow: 0 1px 2px #0006; line-height: 1.15; }
.tile:active { filter: brightness(1.25); }
.tile b { font-weight: 800; }
.tile span { font-weight: 600; opacity: .92; }
@media (max-width: 380px) { .tabbar button { font-size: 10px; } }

/* v9: swipe-back strip along the left edge (keeps page scrolling free of blocking touch handlers) */
.edge { position: absolute; left: 0; top: 0; bottom: 0; width: 14px; z-index: 38; touch-action: none; cursor: pointer; }
.updbar { position: absolute; left: 50%; transform: translateX(-50%); top: calc(var(--safe-t) + 10px); z-index: 61; background: var(--up); color: #04210f;
  font-weight: 700; font-size: 14px; padding: 10px 16px; border-radius: 999px; box-shadow: 0 8px 30px rgba(0,0,0,.4); white-space: nowrap; }
@media (display-mode: standalone) and (orientation: portrait) { .updbar { top: calc(max(var(--safe-t), 59px) + 10px); } }

/* ---------- v11: career, seasons, contests, props, locker ---------- */
#draft { z-index: 36; padding-bottom: calc(var(--safe-b) + 110px); }
.career { display: flex; gap: 12px; align-items: center; margin-top: 6px; }
.career .lvl { width: 54px; height: 54px; border-radius: 16px; flex: none; display: grid; place-items: center; align-content: center;
  background: linear-gradient(140deg, var(--accent), color-mix(in srgb, var(--accent) 35%, #000)); color: #04140b; }
.career .lvl b { font-size: 22px; line-height: 1; } .career .lvl span { font-size: 8.5px; font-weight: 800; letter-spacing: .08em; }
.xpbar, .tierbar, .capbar { height: 7px; border-radius: 4px; background: var(--card2); overflow: hidden; margin: 7px 0 5px; }
.xpbar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }

  background: linear-gradient(90deg, color-mix(in srgb, var(--tc) 18%, var(--card)), var(--card) 70%); }
.season-strip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--tc); flex: none; }
.season-strip b { color: var(--tc); }
.gtabs .chip { font-size: 14px; padding: 7px 14px; }
.tier-badge { flex: none; border-radius: 30%; display: grid; place-items: center; font-weight: 900; color: #0b0d10;
  background: linear-gradient(140deg, var(--tc), color-mix(in srgb, var(--tc) 45%, #000)); box-shadow: 0 0 22px color-mix(in srgb, var(--tc) 40%, transparent); }
.season-card { background: linear-gradient(160deg, color-mix(in srgb, var(--tc) 14%, var(--card)), var(--card) 60%); }
.tiers { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-top: 12px; text-align: center; }
.tiers div { font-size: 10px; color: var(--faint); display: flex; flex-direction: column; align-items: center; gap: 2px; }
.tiers i { width: 14px; height: 14px; border-radius: 4px; background: var(--tc); opacity: .35; }

.goal .check { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; flex: none; font-weight: 900; color: #04210f; }

.contest-lg { margin-bottom: 10px; }
.ctier { display: flex; align-items: center; gap: 10px; padding: 10px 0 0; margin-top: 10px; border-top: 1px solid var(--line); }
.contest { margin-bottom: 10px; }
.stand { margin-top: 10px; font-size: 13px; }
.stand div { display: flex; justify-content: space-between; padding: 5px 8px; border-radius: 8px; color: var(--muted); }
.stand div.you { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--text); font-weight: 700; }
.lineup { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 10px; }
.lineup button { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; min-width: 0; }
.lineup .avatar, .lineup .avatar-fallback { width: 38px; height: 38px; font-size: 11px; }

.draft-row .sal { font-weight: 800; font-size: 14px; flex: none; }

.picked { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; min-height: 4px; }

.draft-foot { position: absolute; left: 0; right: 0; bottom: 0; z-index: 37; padding: 8px 16px max(var(--safe-b), 10px); background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: .5px solid var(--line); }

.slip { border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); margin-bottom: 6px; }

.props-game { margin-bottom: 10px; padding-bottom: 6px; }
.prop-row { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }

.ou { flex: none; width: 64px; padding: 6px 0; border-radius: 10px; background: var(--card2); font-weight: 800; font-size: 14px; line-height: 1.1; text-align: center; border: 1.5px solid transparent; }

.packs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pack { border-radius: 16px; padding: 14px 12px; text-align: left; min-height: 112px; display: flex; flex-direction: column; gap: 4px; color: #fff; position: relative; overflow: hidden; }
.pack.starter { background: linear-gradient(150deg, #2f3640, #171b21); }

.pack.locked { filter: grayscale(.85); opacity: .6; }
.pack:active { transform: scale(.96); }
.pk-name { font-weight: 800; font-size: 16px; }
.pk-cost { margin-top: auto; font-weight: 800; }
.themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.theme { background: var(--card); border-radius: 14px; padding: 10px; text-align: center; border: 1.5px solid transparent; }
.theme.on { border-color: var(--ta); }
.theme .sw { height: 46px; border-radius: 10px; background: var(--tb); display: grid; place-items: center; border: 1px solid var(--line); }
.theme .sw i { width: 22px; height: 22px; border-radius: 50%; background: var(--ta); box-shadow: 0 0 14px var(--ta); }
.theme .t { font-weight: 700; font-size: 13px; margin-top: 6px; }

.overlay { position: absolute; inset: 0; z-index: 55; background: rgba(5,6,8,.94); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: center; padding: calc(var(--safe-t) + 20px) 18px calc(var(--safe-b) + 20px); overflow-y: auto; animation: fade .25s; }
.pv-inner { text-align: center; width: 100%; max-width: 520px; display: flex; flex-direction: column; align-items: center; }
.pv-cards { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.pv-card { width: 100px; aspect-ratio: 3 / 4; perspective: 800px; position: relative; }
.pv-back, .pv-front { position: absolute; inset: 0; border-radius: 14px; backface-visibility: hidden; -webkit-backface-visibility: hidden; transition: transform .55s cubic-bezier(.2,.8,.2,1); }
.pv-back { background: repeating-linear-gradient(45deg, #1b2129, #1b2129 8px, #222a33 8px, #222a33 16px); border: 2px solid #39424d; display: grid; place-items: center; font-weight: 900; font-size: 30px; color: var(--accent); }
.pv-front { transform: rotateY(180deg); background: linear-gradient(#1d232c, #0d1014); border: 2px solid var(--rc); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 8px; box-shadow: 0 0 24px color-mix(in srgb, var(--rc) 45%, transparent); }
.pv-card.flipped .pv-back { transform: rotateY(180deg); }
.pv-card.flipped .pv-front { transform: rotateY(360deg); }
.pv-front .avatar, .pv-front .avatar-fallback { width: 44px; height: 44px; }
.pv-front .pc-name { font-size: 12px; font-weight: 700; max-width: 100%; }
.recap-card { width: 100%; max-width: 380px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.recap-card h1 { color: var(--tc); }
.recap-rows { width: 100%; background: var(--card); border-radius: 14px; padding: 4px 14px; margin: 10px 0; }
.recap-rows div { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.recap-rows div:last-child { border-bottom: 0; }
.recap-rows span { color: var(--muted); }

  background: radial-gradient(circle, color-mix(in srgb, var(--rc) 30%, transparent), transparent 70%); pointer-events: none; }

.cmp-row.sched b { font-weight: 500; font-size: 12.5px; color: var(--muted); }
.diff { font-size: 11.5px; font-weight: 700; padding: 4px 9px; border-radius: 999px; background: var(--card2); color: var(--muted); flex: none; }
.diff.easy { background: var(--up-bg); color: var(--up); }
.diff.tough { background: var(--down-bg); color: var(--down); }
.jr .sub { white-space: normal; }
.ach-hero { display: flex; gap: 12px; align-items: center; background: var(--card); border-radius: 16px; padding: 14px; margin-top: 14px; }
.ach-hero .lvl { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; font-weight: 800; font-size: 24px; background: linear-gradient(135deg, var(--up), color-mix(in srgb, var(--up) 45%, #000)); color: #04140b; }
.ach-hero .name { font-weight: 800; font-size: 18px; }
.ach-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.ach { background: var(--card); border-radius: 16px; padding: 14px; min-width: 0; }
.ach.off { opacity: .45; }
.ach .e { font-size: 24px; }
.ach .v { font-size: 22px; font-weight: 800; margin-top: 6px; }
.ach .t { font-weight: 700; font-size: 13.5px; margin: 2px 0; }
.setbar { height: 6px; border-radius: 3px; background: var(--card2); margin-top: 7px; overflow: hidden; }
.setbar i { display: block; height: 100%; background: var(--up); border-radius: 3px; }
.stake { margin-top: 8px; }

/* Larger text (iPhone honours this for every size in the app). */
html.big-text { -webkit-text-size-adjust: 116%; text-size-adjust: 116%; }

/* Light theme */
html[data-mode="light"] {
  --bg: #f4f5f7; --card: #ffffff; --card2: #e9ecf0; --line: #dcdfe5; --text: #12161b; --muted: #5d6672; --faint: #8b939e;
  --up: #0a9d57; --down: #e0353a; --up-bg: rgba(10, 157, 87, .12); --down-bg: rgba(224, 53, 58, .11); --accent: #0a9d57;

}
html[data-mode="light"] .sheet { box-shadow: -8px 0 30px rgba(0,0,0,.12); }

html[data-mode="light"] .tools button, html[data-mode="light"] .cmp-table, html[data-mode="light"] .cmp-h, html[data-mode="light"] .ach { box-shadow: 0 1px 2px rgba(16,24,40,.06); }
/* Cards, packs and the season strip keep their dark look in the light theme. */
html[data-mode="light"] .mc, html[data-mode="light"] .pack, html[data-mode="light"] #packview, html[data-mode="light"] .pcard,
html[data-mode="light"] .season-strip, html[data-mode="light"] .toast {
  --text: #eceef1; --muted: #9aa2ad; --faint: #6b7380; --card: #14171c; --card2: #1b1f26; --line: #262b33; --up: #1fd67a; --down: #ff5a5f; color: var(--text);
}
html[data-mode="light"] .season-strip { background-color: #14171c; }
/* Tabs with a big title: the sync badge shrinks to its dot so the search button fits. */
.topbar h1 + .row .sync { font-size: 0; gap: 0; padding: 8px; }

/* ---------- v35 ---------- */
.tools.hscroll { display: flex; margin-top: 14px; }
.tools.hscroll button { width: 84px; }
.tag.short { background: var(--down-bg); color: var(--down); }
.prot, .shortc { margin-top: 14px; }
.shortc { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; }
.shortc .e { font-size: 24px; }
.prot-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; }
.prot-row label { font-size: 12px; color: var(--muted); display: grid; gap: 4px; }
.pf { display: flex; align-items: center; gap: 4px; background: var(--card2); border-radius: 10px; padding: 0 10px; }
.pf input { width: 100%; min-width: 0; background: none; border: 0; outline: none; color: var(--text); font-size: 16px; font-weight: 700; padding: 9px 0; text-align: right; }
.pf span { color: var(--muted); font-weight: 700; }
ul.plain { margin: 8px 0 0; padding-left: 18px; color: var(--muted); font-size: 13.5px; line-height: 1.5; }
.rivalc { margin-top: 14px; display: block; width: 100%; text-align: left; }
.vsline { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 16px; margin: 6px 0 4px; }
.vsline b { font-size: 18px; }
.riskhero { display: flex; gap: 14px; align-items: center; margin-top: 14px; }
.riskhero .name { font-size: 19px; font-weight: 800; }
.ring { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; flex: none;
  background: conic-gradient(var(--rc) calc(var(--p) * 1%), var(--card2) 0); position: relative; }
.ring::after { content: ''; position: absolute; inset: 7px; border-radius: 50%; background: var(--card); }
.ring b { position: relative; z-index: 1; font-size: 20px; }
.item.fut.on { outline: 2px solid var(--up); outline-offset: -2px; }
.item.fut:disabled { opacity: .55; }
.glance { display: grid; gap: 12px; margin-top: 18px; text-align: center; }
.g-num { font-size: clamp(44px, 15vw, 68px); font-weight: 800; letter-spacing: -.03em; line-height: 1.05; }
.g-chg { font-size: 19px; font-weight: 700; margin-bottom: 8px; }
.g-tile { background: var(--card); border-radius: 18px; padding: 16px; text-align: left; display: block; width: 100%; }
.g-big { font-size: 22px; font-weight: 800; margin: 3px 0; }
.lay.off .name { color: var(--faint); }
.lay .x-btn:disabled { opacity: .3; }
.lay .x-btn { margin-left: 2px; }
.show .shc { width: 132px; background: var(--card); border-radius: 14px; padding: 12px; text-align: left; border-left: 4px solid var(--rc); display: grid; gap: 3px; }
.show { margin-top: 10px; }
.shc .name { font-weight: 700; }
/* Colour-blind friendly: blue up, orange down (arrows and signs stay as they are). */
html.cb { --up: #3b9dff; --down: #ff9f1a; --up-bg: rgba(59, 157, 255, .14); --down-bg: rgba(255, 159, 26, .14); }
html.cb[data-mode="light"] { --up: #0b6bd3; --down: #c26a00; --up-bg: rgba(11, 107, 211, .12); --down-bg: rgba(194, 106, 0, .12); }

button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--up); outline-offset: 2px; }
.rs-tiles > div:last-child:nth-child(odd) { grid-column: span 2; }

/* ---------- v37 ---------- */
.tag.ipo { background: color-mix(in srgb, #ffb020 22%, transparent); color: #ffb020; }
.evb { display: flex; gap: 10px; align-items: center; margin-top: 10px; border: 1px solid color-mix(in srgb, #ffb020 45%, var(--line)); }
.ipos { margin-bottom: 4px; }
.ipoc, .repc { margin-top: 14px; }
.ipoc { border: 1px solid color-mix(in srgb, #ffb020 40%, var(--line)); }
.grade { display: inline-block; min-width: 26px; text-align: center; padding: 1px 7px; border-radius: 7px; background: var(--card2); }
.grade.gA, .grade.gB { background: var(--up-bg); color: var(--up); }
.grade.gD, .grade.gF { background: var(--down-bg); color: var(--down); }

.pin-in { display: flex; align-items: center; gap: 10px; padding: calc(var(--safe-t) + 6px) 16px 8px; margin-top: calc(-1 * var(--safe-t) - 8px);
  background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-bottom: 1px solid var(--line);
  opacity: 0; transform: translateY(-8px); transition: opacity .18s, transform .18s; }
.pin.on .pin-in { opacity: 1; transform: none; pointer-events: auto; }
.pin-in > b { font-size: 16px; min-width: 0; }
.pin-in .icon-btn { width: 34px; height: 34px; flex: none; }
.pin-p { display: grid; justify-items: end; line-height: 1.15; flex: none; }
.pin-p span { font-size: 12px; font-weight: 700; }
/* Long-press quick actions */
.qa { position: absolute; inset: 0; z-index: 60; }
.qa-back { position: absolute; inset: 0; background: rgba(0,0,0,.5); animation: chartfade .15s both; }
.qa-panel { position: absolute; left: 10px; right: 10px; bottom: calc(var(--safe-b) + 12px); background: var(--card); border-radius: 22px; padding: 16px; box-shadow: 0 12px 40px rgba(0,0,0,.45);
  animation: qain .2s cubic-bezier(.2,.8,.2,1) both; max-width: 620px; margin: 0 auto; }
@keyframes qain { from { transform: translateY(24px); opacity: 0; } }
.qa-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 8px; }
.qa-grid button { background: var(--card2); border-radius: 14px; padding: 12px 4px; display: grid; justify-items: center; gap: 4px; font-size: 12.5px; font-weight: 700; }
.qa-grid button span { font-size: 20px; line-height: 1; }

        <p><b>Players</b> are valued on how good they are compared with others at their position: this season's stats blended with last season's, then updated after every game. Each standard deviation of performance roughly doubles the price, so superstars cost many times more than role players.</p>
        <p>A game only moves a price by how much it <b>beat or missed that player's usual level</b>. A star playing like a star stays put; a role player's breakout game jumps. <b>Teams</b> start from last season's record (regressed toward .500) and shift as this season's wins, losses and point differential come in.</p>
        <p><b>Market hype</b> is a slow random drift on top of everything, like a real market's mood, so nothing is a sure thing.</p>
        <p><b>Star premium:</b> the top 10% of players in each league (ranked at the start of the season) carry up to a 4\xD7 premium, so household names are the expensive ones in every sport. <b>Teams</b> are the blue chips: a .500 team is about $1,000 a share.</p>
