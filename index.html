<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>StatStreet</title>
  <meta name="description" content="A stock market for NBA, NFL and MLB players and teams, priced by real-life performance.">
  <meta name="theme-color" content="#0b0d10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StatStreet">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>:root {
  --bg: #0b0d10;
  --card: #14171c;
  --card2: #1b1f26;
  --line: #262b33;
  --text: #eceef1;
  --muted: #8b939e;
  --faint: #5b636e;
  --up: #1fd67a;
  --down: #ff5a5f;
  --up-bg: rgba(31, 214, 122, .12);
  --down-bg: rgba(255, 90, 95, .12);
  --accent: #1fd67a;
  --live: #ff3b30;
  --nba: #f97316; --nfl: #22c55e; --mlb: #3b82f6;
  --r: 14px;
  --safe-t: env(safe-area-inset-top);
  --safe-b: env(safe-area-inset-bottom);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased; overscroll-behavior-y: none;
  font-variant-numeric: tabular-nums;
}
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; }
img { display: block; }
[hidden] { display: none !important; }

.view { padding: calc(var(--safe-t) + 12px) 16px calc(var(--safe-b) + 90px); max-width: 640px; margin: 0 auto; }

/* ---------- tab bar ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: flex; justify-content: space-around;
  padding: 6px 8px calc(var(--safe-b) + 6px);
  background: rgba(11, 13, 16, .92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--line);
}
.tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; color: var(--faint); padding: 4px 0; }
.tabbar svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabbar button.active { color: var(--text); }

/* ---------- type ---------- */
h1 { font-size: 30px; line-height: 1.1; margin: 0; letter-spacing: -.02em; font-weight: 700; }
h2 { font-size: 20px; margin: 26px 0 10px; letter-spacing: -.01em; }
h3 { font-size: 13px; margin: 20px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 13px; }
.tiny { font-size: 11.5px; }
.up { color: var(--up); }
.down { color: var(--down); }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; min-height: 30px; }
.brand { font-weight: 800; letter-spacing: -.02em; font-size: 17px; }
.brand b { color: var(--accent); }
.sync { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.sync .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.sync.busy .dot { background: var(--accent); animation: pulse 1s infinite; }
.sync.err .dot { background: var(--down); }
@keyframes pulse { 50% { opacity: .3; } }

.big-value { font-size: 38px; font-weight: 700; letter-spacing: -.03em; margin-top: 8px; }
.change-line { font-size: 14px; margin-top: 2px; }

/* ---------- segmented / chips ---------- */
.seg { display: flex; background: var(--card); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { flex: 1; padding: 7px 0; border-radius: 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
.seg button.on { background: var(--card2); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.4); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 4px; scrollbar-width: none; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 6px 12px; border-radius: 999px; background: var(--card); font-size: 13px; color: var(--muted); border: 1px solid transparent; font-weight: 600; }
.chip.on { color: var(--text); border-color: var(--line); background: var(--card2); }
.ranges { display: flex; justify-content: space-between; margin: 6px 0 4px; }
.ranges button { padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 700; color: var(--muted); }
.ranges button.on { background: var(--card2); color: var(--text); }

/* ---------- cards & lists ---------- */
.card { background: var(--card); border-radius: var(--r); padding: 14px; }
.list { background: var(--card); border-radius: var(--r); overflow: hidden; }
.item { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
.item:last-child { border-bottom: 0; }
.item:active { background: var(--card2); }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--card2); object-fit: cover; flex: none; overflow: hidden; }
.avatar.team { border-radius: 10px; object-fit: contain; padding: 4px; background: #fff1; }
.avatar-fallback { width: 40px; height: 40px; border-radius: 50%; background: var(--card2); display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--muted); flex: none; }
.name { font-weight: 600; }
.sub { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.price-col { text-align: right; flex: none; }
.price { font-weight: 600; }
.pill { display: inline-block; min-width: 72px; text-align: center; padding: 5px 8px; border-radius: 8px; font-size: 13px; font-weight: 700; }
.pill.up { background: var(--up-bg); } .pill.down { background: var(--down-bg); }
.lg { font-size: 10px; font-weight: 800; padding: 1px 5px; border-radius: 4px; letter-spacing: .04em; color: #0b0d10; }
.lg.nba { background: var(--nba); } .lg.nfl { background: var(--nfl); } .lg.mlb { background: var(--mlb); }
.tag { font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 4px; background: var(--card2); color: var(--muted); }
.tag.inj { background: var(--down-bg); color: var(--down); }
.tag.live { background: var(--live); color: #fff; animation: pulse 1.6s infinite; }
.tag.ipo { background: #7c5cff33; color: #b8a6ff; }
.spark { flex: none; }
.empty { padding: 26px 16px; text-align: center; color: var(--muted); font-size: 14px; }
.more { display: block; width: 100%; padding: 13px; color: var(--accent); font-weight: 600; font-size: 14px; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--card); border-radius: 12px; padding: 11px 12px; }
.stat .k { font-size: 11.5px; color: var(--muted); }
.stat .v { font-size: 17px; font-weight: 700; margin-top: 2px; }

.index-card { background: var(--card); border-radius: 12px; padding: 10px 12px; text-align: left; }
.index-card .v { font-weight: 700; font-size: 16px; margin-top: 3px; }

.live-strip { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 4px; scrollbar-width: none; }
.live-strip::-webkit-scrollbar { display: none; }
.game { flex: none; background: var(--card); border-radius: 12px; padding: 9px 12px; min-width: 150px; font-size: 13px; }
.game .t { display: flex; justify-content: space-between; gap: 12px; font-weight: 600; }

.search { width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; outline: none; font-size: 16px; }
.search:focus { border-color: var(--faint); }

/* ---------- chart ---------- */
.chart-wrap { margin: 10px -16px 0; padding: 0 0; min-height: 190px; }
.chart { display: block; touch-action: pan-y; -webkit-user-select: none; user-select: none; }
.chart-empty { height: 190px; display: grid; place-items: center; color: var(--faint); font-size: 13px; padding: 0 30px; text-align: center; }

/* ---------- detail sheet ---------- */
.sheet {
  position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: calc(var(--safe-t) + 8px) 16px calc(var(--safe-b) + 100px);
}
.sheet.enter { animation: slidein .22s ease-out; }
#chain { z-index: 33; }
body.locked { overflow: hidden; position: fixed; left: 0; right: 0; }
@keyframes slidein { from { transform: translateX(30px); opacity: 0; } }
.sheet-inner { max-width: 640px; margin: 0 auto; }
.icon-btn { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; background: var(--card); }
.icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn.on svg { fill: #ffd60a; stroke: #ffd60a; }
.hero { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
.hero .avatar, .hero .avatar-fallback { width: 56px; height: 56px; }
.trade-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 32; display: flex; gap: 10px;
  padding: 10px 16px calc(var(--safe-b) + 10px); background: rgba(11,13,16,.94); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border-top: 1px solid var(--line);
}
.btn { flex: 1; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 16px; text-align: center; }
.btn.buy { background: var(--up); color: #04210f; }
.btn.sell { background: var(--card2); color: var(--text); }
.btn.sell:disabled { opacity: .4; }
.btn.ghost { background: var(--card); }
.btn.danger { background: var(--down-bg); color: var(--down); }

.driver { display: flex; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--line); align-items: flex-start; }
.driver:last-child { border-bottom: 0; }
.driver .ic { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-size: 13px; flex: none; background: var(--card2); }
.driver .txt { flex: 1; font-size: 14px; min-width: 0; }
.driver .pct { font-weight: 700; font-size: 13px; flex: none; }

.bars { display: flex; align-items: flex-end; gap: 6px; height: 60px; margin-top: 8px; }
.bars div { flex: 1; border-radius: 4px 4px 0 0; background: var(--up); min-height: 3px; }
.bars div.neg { background: var(--down); }

.brk { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.brk:last-child { border-bottom: 0; }

/* ---------- trade sheet ---------- */
.trade-sheet { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; overscroll-behavior: contain; }
.trade-panel {
  width: 100%; max-width: 640px; margin: 0 auto; background: var(--card); border-radius: 20px 20px 0 0;
  padding: 10px 16px calc(var(--safe-b) + 16px); max-height: 92vh; overflow-y: auto; overscroll-behavior: contain;
}
.trade-panel.enter { animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(40px); opacity: .4; } }
.grabber { width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
.qty { display: flex; align-items: center; gap: 12px; margin: 18px 0 8px; }
.qty input { flex: 1; text-align: center; font-size: 40px; font-weight: 700; background: none; border: 0; outline: none; width: 100%; min-width: 0; }
.qty button { width: 46px; height: 46px; border-radius: 50%; background: var(--card2); font-size: 24px; font-weight: 600; }
.quick { display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; }
.quick button { padding: 7px 14px; border-radius: 999px; background: var(--card2); font-size: 13px; font-weight: 600; }
.summary { border-top: 1px solid var(--line); padding-top: 10px; margin-bottom: 14px; }
.summary .brk { border: 0; padding: 5px 0; }
.err { color: var(--down); font-size: 13px; min-height: 18px; text-align: center; margin-bottom: 6px; }

/* ---------- news ---------- */
.news { display: block; padding: 13px 14px; border-bottom: 1px solid var(--line); text-decoration: none; }
.news:last-child { border-bottom: 0; }
.news .h { font-weight: 600; font-size: 15px; }
.news .meta { display: flex; gap: 8px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
.senti { font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 5px; }
.senti.up { background: var(--up-bg); } .senti.down { background: var(--down-bg); } .senti.flat { background: var(--card2); color: var(--muted); }
.tk { font-size: 12px; font-weight: 700; padding: 2px 7px; border-radius: 5px; background: var(--card2); }

/* ---------- account ---------- */
.field { display: block; margin: 8px 0; }
.field input[type=text], .field input[type=url] { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; outline: none; font-size: 15px; }
.toggle { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.toggle:last-child { border-bottom: 0; }
.switch { position: relative; width: 50px; height: 30px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; background: var(--card2); border-radius: 30px; transition: .2s; }
.switch span::after { content: ''; position: absolute; width: 26px; height: 26px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: .2s; }
.switch input:checked + span { background: var(--up); }
.switch input:checked + span::after { transform: translateX(20px); }
.btn-row { display: flex; gap: 10px; margin-top: 10px; }
.prose p { margin: 0 0 10px; color: var(--muted); font-size: 14px; }
.prose b { color: var(--text); }
details summary { cursor: pointer; font-weight: 600; padding: 12px 14px; list-style: none; }
details summary::-webkit-details-marker { display: none; }
details[open] summary { border-bottom: 1px solid var(--line); }
details .prose { padding: 12px 14px 4px; }

/* ---------- boot & toast ---------- */
.boot { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; justify-content: center; padding: 30px 26px calc(var(--safe-b) + 30px); }
.boot .logo { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 20px; }
.boot h1 { font-size: 28px; }
.boot .log { margin-top: 22px; font-size: 13.5px; color: var(--muted); min-height: 120px; }
.boot .log div { padding: 3px 0; }
.boot .log div:last-child { color: var(--text); }
.bar { height: 4px; background: var(--card2); border-radius: 2px; overflow: hidden; margin-top: 18px; }
.bar i { display: block; height: 100%; width: 30%; background: var(--accent); border-radius: 2px; animation: slide 1.2s infinite ease-in-out; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }

.toast {
  position: fixed; left: 50%; bottom: calc(var(--safe-b) + 88px); transform: translate(-50%, 20px); z-index: 60;
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px;
  opacity: 0; pointer-events: none; transition: .25s; max-width: calc(100% - 40px); text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (min-width: 700px) {
  .chart-wrap { margin: 10px 0 0; }
}

/* ---------- v2 additions ---------- */
.sheet, .trade-panel, .trade-bar { --acc: var(--up); }
.sheet.acc-down, .trade-bar.acc-down { --acc: var(--down); }
.unit-lbl { font-size: 13px; color: var(--muted); text-align: center; margin: -4px 0 10px; }
.sheet .ranges button.on { color: var(--acc); }
.btn.buy { background: var(--acc, var(--up)); }
.btn.opt { flex: .8; background: var(--card2); color: var(--text); }
.btn.small { flex: none; padding: 9px 14px; font-size: 14px; border-radius: 10px; }
.icons-right { display: flex; gap: 8px; }
.icon-btn.alerting svg { stroke: #ffd60a; }
.badge-dot { position: relative; }
.badge-dot[data-n]::after { content: attr(data-n); position: absolute; top: -3px; right: -3px; min-width: 17px; height: 17px; border-radius: 9px; background: var(--down); color: #fff; font-size: 10.5px; font-weight: 800; display: grid; place-items: center; padding: 0 4px; }
.sub-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.vs { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.vs b { font-weight: 700; }

.alloc { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--card2); margin-top: 10px; }
.alloc i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 12px; color: var(--muted); }
.legend span::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: var(--c); margin-right: 5px; }

.collections { display: flex; gap: 10px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px 6px; scrollbar-width: none; }
.collections::-webkit-scrollbar { display: none; }
.coll { flex: none; width: 150px; background: var(--card); border-radius: 14px; padding: 12px; text-align: left; }
.coll .e { font-size: 22px; }
.coll .t { font-weight: 700; margin-top: 6px; font-size: 14px; }
.coll .d { font-size: 12px; color: var(--muted); margin-top: 2px; }

.rating { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 10px; gap: 2px; }
.rating i { display: block; height: 100%; }
.rating-legend { display: flex; justify-content: space-between; font-size: 12.5px; margin-top: 6px; }
.big-pct { font-size: 28px; font-weight: 800; }

.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
.stats-grid div { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; gap: 8px; }
.stats-grid div span { color: var(--muted); }
.about { font-size: 14px; color: var(--muted); }

.opt-row { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
.opt-row:last-child { border-bottom: 0; }
.opt-row.itm { background: color-mix(in srgb, var(--acc, var(--up)) 7%, transparent); }
.opt-row .k { font-weight: 700; font-size: 16px; }
.opt-row .ask { min-width: 78px; text-align: center; padding: 7px 8px; border-radius: 9px; font-weight: 700; font-size: 14px; border: 1px solid var(--acc, var(--up)); color: var(--acc, var(--up)); }
.opt-row .held { font-size: 10.5px; font-weight: 800; color: #0b0d10; background: #ffd60a; border-radius: 4px; padding: 1px 5px; margin-left: 6px; }
.price-line { text-align: center; font-size: 11.5px; color: var(--muted); padding: 5px; background: var(--card2); letter-spacing: .04em; font-weight: 700; }
.exp-chips .chip { text-align: center; line-height: 1.2; }
.exp-chips .chip small { display: block; font-size: 10.5px; font-weight: 600; color: var(--faint); }
.payoff { margin: 8px 0 4px; }
.payoff svg { display: block; width: 100%; }

.type-chips { display: flex; gap: 6px; margin-top: 12px; overflow-x: auto; scrollbar-width: none; }
.type-chips button { flex: none; padding: 6px 12px; border-radius: 999px; background: var(--card2); color: var(--muted); font-size: 13px; font-weight: 700; }
.type-chips button.on { background: var(--text); color: var(--bg); }
.unit-toggle { display: flex; justify-content: center; margin-top: 10px; }
.unit-toggle .seg { width: 200px; }
.price-field { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--card2); border-radius: 12px; padding: 8px 12px; margin-top: 12px; }
.price-field input { width: 120px; text-align: right; background: none; border: 0; outline: none; font-size: 18px; font-weight: 700; }
.order-desc { font-size: 13px; color: var(--muted); text-align: center; margin: 6px 0 2px; }

.slider { position: relative; height: 58px; border-radius: 29px; background: var(--card2); overflow: hidden; margin-top: 6px; touch-action: none; user-select: none; -webkit-user-select: none; }
.slider .fill { position: absolute; inset: 0 auto 0 0; width: 58px; background: var(--acc, var(--up)); opacity: .25; border-radius: 29px; }
.slider .txt { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; color: var(--muted); font-size: 15px; pointer-events: none; }
.slider .knob { position: absolute; top: 4px; left: 4px; width: 50px; height: 50px; border-radius: 25px; background: var(--acc, var(--up)); color: #04210f; display: grid; place-items: center; font-size: 24px; font-weight: 800; cursor: grab; touch-action: none; }
.slider.disabled { opacity: .45; pointer-events: none; }
.slider.done .knob { transition: left .15s; }
.link-btn { display: block; margin: 10px auto 0; color: var(--muted); font-weight: 600; font-size: 14px; padding: 6px 12px; }

.inbox-item { display: flex; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--line); font-size: 14px; }
.inbox-item:last-child { border-bottom: 0; }
.inbox-item.new { background: color-mix(in srgb, var(--up) 6%, transparent); }
.inbox-item .ic { flex: none; }
