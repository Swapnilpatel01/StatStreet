<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="build" content="dev">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>StatStreet</title>
  <meta name="description" content="A stock market for NBA, NFL and MLB players and teams, priced by real-life performance.">
  <meta name="theme-color" content="#0b0d10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StatStreet">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1320x2868.png">
  <link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1206x2622.png">
  <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1290x2796.png">
  <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1179x2556.png">
  <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1284x2778.png">
  <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1170x2532.png">
  <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1125x2436.png">
  <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1242x2688.png">
  <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="icons/splash-828x1792.png">
  <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="icons/splash-750x1334.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="ptr"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg></div>
  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar" aria-label="Main sections">
    <button data-tab="home" class="active">
      <svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 4 8-8"/><path d="M15 8h5v5"/></svg><span>Portfolio</span>
    </button>
    <button data-tab="market">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span>Stocks</span>
    </button>
    <button data-tab="games">
      <svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4"/><path d="M12 13v4M8.5 20.5h7"/></svg><span>Games</span>
    </button>
    <button data-tab="marketplace">
      <svg viewBox="0 0 24 24"><path d="M3 10l9-6 9 6"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8"/><path d="M3 21h18"/></svg><span>Marketplace</span>
    </button>
    <button data-tab="news">
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg><span>News</span>
    </button>
    <button data-tab="account">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span>Account</span>
    </button>
  </nav>

  <section id="game" class="sheet" hidden></section>
  <section id="draft" class="sheet" hidden></section>
  <div id="dfoot" class="draft-foot" hidden></div>
  <section id="sheet" class="sheet" hidden></section>
  <div id="tradebar" class="trade-bar" hidden></div>
  <section id="chain" class="sheet" hidden></section>
  <section id="article" class="sheet" hidden></section>
  <section id="page" class="sheet" hidden></section>
  <div id="edge" class="edge" hidden></div>
  <section id="trade" class="trade-sheet" hidden><div class="trade-panel" id="panel"></div></section>
  <div id="packview" class="overlay" hidden></div>
  <div id="recap" class="overlay" hidden></div>
  <canvas id="confetti" hidden></canvas>
  <div id="boot" class="boot" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <button id="updbar" class="updbar" hidden>New version ready · tap to update</button>

  <script type="module" src="js/app.js"></script>
</body>
</html>
